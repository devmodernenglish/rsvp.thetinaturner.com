name: Deploy to Client Cloudflare Account

on:
  push:
    branches:
      - production
  workflow_dispatch: # Keeps the manual "Run workflow" button active in GitHub UI for conveniencey
jobs:
  deploy-to-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build
        env:
          # Optional: Pass client-specific environment variables at build time if needed
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          KLAVIYO_LIST_ID: ${{ secrets.KLAVIYO_LIST_ID }}

      - name: Deploy to Client Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLIENT_CF_API_TOKEN }}
          accountId: ${{ secrets.CLIENT_CF_ACCOUNT_ID }}
          # projectName: "rsvp-tinaturner-com" # Must match project name created in Step 1
          command: pages deploy dist --project-name=rsvp-tinaturner-com --branch=production
